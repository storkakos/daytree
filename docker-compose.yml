name: daytree

services:
  daytree:
    build: .
    container_name: daytree
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"        # dashboard (use on the home network only)
      # Port 8081 is intentionally NOT published: the built-in Cloudflare tunnel reaches it internally.
    environment:
      TZ: ${TZ:-Europe/Berlin}      # time zone name, e.g. Europe/London
      SETTINGS_LOCK: ${SETTINGS_LOCK:-false}   # true = the settings need a password, which is set in the browser
      HTTPS_URL: ${HTTPS_URL:-}     # e.g. https://daytree.example.com when a reverse proxy serves HTTPS; empty = off
      # No credentials here: everything is entered in the dashboard under "Settings"
      # and stored encrypted in /data/settings.enc.
    volumes:
      - daytree-data:/data         # encrypted settings, ICS file, sync state
      - daytree-secrets:/secrets   # encryption key file - kept apart from the data (do not back up together)

volumes:
  daytree-data:
  daytree-secrets:
